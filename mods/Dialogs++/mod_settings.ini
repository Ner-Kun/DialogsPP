[Mod]
Id = DialogsPlusPlus
Name = Dialogs++
Author = Ner_Kun
Version = 1.0.1
Description = Mouse wheel scrolls dialogue replies; left click skips lines and confirms the highlighted reply.

[Setting.SkipLines]
Id = SkipLines
Type = picker
Label = Skip lines with...
Description = Which inputs skip dialogue lines.
Group = General
PresetValues = 0|1|2|3
PresetLabels = Off|Left click|Space|Both
Default = 3
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = SkipLines

[Setting.TwoPress]
Id = TwoPress
Type = toggle
Label = Two-press skip
Description = First press shows the skip prompt, second press skips. Vanilla-like.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = TwoPress

[Setting.HidePrompt]
Id = HidePrompt
Type = toggle
Label = Hide skip prompt
Description = Collapse the press-space prompt widget. Visual only. Two-press skip shows it anyway on the first press.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = HidePrompt

[Setting.WheelScroll]
Id = WheelScroll
Type = toggle
Label = Wheel scrolls replies
Description = Scroll reply lists with the mouse wheel.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = WheelScroll

[Setting.KbNav]
Id = KbNav
Type = toggle
Label = Keyboard control
Description = W/S move the reply highlight, the confirm key confirms (see below).
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = KbNav

[Setting.ConfirmKey]
Id = ConfirmKey
Type = picker
Label = Confirm key...
Description = Which key confirms the highlighted reply. Needs keyboard control on.
Group = General
PresetValues = 0|1|2
PresetLabels = E|F|Both
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = ConfirmKey

[Setting.TimerExtendSec]
Id = TimerExtendSec
Type = integer
Label = Timed choice extra time, s
Description = Lengthen timed choices to this many seconds. 0 = vanilla timer.
Group = General
Minimum = 0
Maximum = 300
Step = 5
Decimals = 0
Suffix = s
Default = 60
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = TimerExtendSec

[Setting.LogEnabled]
Id = LogEnabled
Type = toggle
Label = Write mod log
Description = Diagnostic lines in UE4SS.log.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = LogEnabled
